name: Render & Publish Episode

# Runs the full free pipeline on GitHub's free Ubuntu runners (remote render):
#   script (Gemini) -> voiceover (Edge TTS) -> Remotion render (batched)
#   -> YouTube upload -> Telegram notify.
# Trigger: Actions tab -> "Run workflow" (enter topic + privacy).

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Episode topic"
        required: true
        default: "GPT-5.6-Sol: Is This New AI Model Actually Worth the Switch?"
      privacy:
        description: "YouTube privacy status"
        required: true
        default: "private"
        type: choice
        options: [private, public, unlisted]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install system deps (ffmpeg + Chrome libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 libatspi2.0-0

      - name: Install Python deps (edge-tts, Gemini, YouTube client, dotenv)
        run: python3 -m pip install -q edge-tts google-genai google-api-python-client google-auth-oauthlib google-auth python-dotenv

      - name: Install Chrome for Testing (Remotion 3.3 has no `browser ensure`)
        run: |
          npx -y @puppeteer/browsers install chrome@stable --path /opt/chrome
          echo "CHROME_BIN=$(find /opt/chrome -type f -name chrome -path '*chrome-linux64*' | head -1)" >> "$GITHUB_ENV"
          echo "Chrome: $CHROME_BIN"

      - name: npm install (incl. framer-motion)
        run: npm install && npm install framer-motion

      - name: Write YouTube OAuth files from secrets
        run: |
          echo "${{ secrets.YOUTUBE_CLIENT_SECRETS }}" > client_secrets.json
          mkdir -p pipeline
          echo "${{ secrets.YOUTUBE_TOKEN }}" > pipeline/youtube_token.json
        shell: bash

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REMOTION_BROWSER_EXECUTABLE: ${{ env.CHROME_BIN }}
        run: python3 pipeline/pipeline.py "${{ github.event.inputs.topic }}" --privacy "${{ github.event.inputs.privacy }}"

      - name: Upload video as artifact (fallback / review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: episode
          path: out/*.mp4
          retention-days: 7
