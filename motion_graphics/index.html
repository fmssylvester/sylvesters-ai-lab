<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }
    
    .composition {
      width: 1920px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    
    .scene {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
    }
    
    .scene.active {
      opacity: 1;
      visibility: visible;
    }
    
    /* Scene 1 - Title Reveal */
    #scene1 {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    
    #s1-title {
      font-size: 120px;
      font-weight: 800;
      color: #fff;
      text-align: center;
      opacity: 0;
      transform: translateY(60px);
    }
    
    #s1-subtitle {
      font-size: 36px;
      font-weight: 400;
      color: #8892b0;
      margin-top: 20px;
      opacity: 0;
      transform: translateY(30px);
    }
    
    /* Scene 2 - Stats */
    #scene2 {
      background: linear-gradient(135deg, #0f3460 0%, #16213e 100%);
    }
    
    .stat-container {
      display: flex;
      gap: 100px;
    }
    
    .stat {
      text-align: center;
      opacity: 0;
      transform: scale(0.5);
    }
    
    .stat-number {
      font-size: 96px;
      font-weight: 800;
      color: #00d9ff;
    }
    
    .stat-label {
      font-size: 24px;
      color: #8892b0;
      margin-top: 10px;
    }
    
    /* Scene 3 - Features */
    #scene3 {
      background: linear-gradient(135deg, #1a1a2e 0%, #0f3460 100%);
    }
    
    .feature {
      display: flex;
      align-items: center;
      gap: 30px;
      margin: 20px 0;
      opacity: 0;
      transform: translateX(-100px);
    }
    
    .feature-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }
    
    .feature-text {
      font-size: 32px;
      color: #fff;
      font-weight: 600;
    }
    
    /* Scene 4 - CTA */
    #scene4 {
      background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
    }
    
    #s4-text {
      font-size: 72px;
      font-weight: 800;
      color: #1a1a2e;
      text-align: center;
      opacity: 0;
      transform: scale(0.8);
    }
    
    #s4-cta {
      margin-top: 40px;
      padding: 20px 60px;
      background: #1a1a2e;
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      border-radius: 50px;
      opacity: 0;
      transform: translateY(30px);
    }
  </style>
</head>
<body>
  <div class="composition" id="root" 
       data-composition-id="motion-demo"
       data-start="0" 
       data-width="1920" 
       data-height="1080">
    
    <!-- Scene 1: Title -->
    <div id="scene1" class="scene active" data-start="0" data-duration="5">
      <h1 id="s1-title">Motion Graphics</h1>
      <p id="s1-subtitle">Real animations, not just zoom</p>
    </div>
    
    <!-- Scene 2: Stats -->
    <div id="scene2" class="scene" data-start="5" data-duration="5">
      <div class="stat-container">
        <div class="stat" id="stat1">
          <div class="stat-number" data-target="100">0</div>
          <div class="stat-label">Animations</div>
        </div>
        <div class="stat" id="stat2">
          <div class="stat-number" data-target="50">0</div>
          <div class="stat-label">Effects</div>
        </div>
        <div class="stat" id="stat3">
          <div class="stat-number" data-target="25">0</div>
          <div class="stat-label">Transitions</div>
        </div>
      </div>
    </div>
    
    <!-- Scene 3: Features -->
    <div id="scene3" class="scene" data-start="10" data-duration="5">
      <div class="feature" id="feat1">
        <div class="feature-icon">T</div>
        <div class="feature-text">Kinetic Typography</div>
      </div>
      <div class="feature" id="feat2">
        <div class="feature-icon">M</div>
        <div class="feature-text">Motion Paths</div>
      </div>
      <div class="feature" id="feat3">
        <div class="feature-icon">S</div>
        <div class="feature-text">Shader Transitions</div>
      </div>
    </div>
    
    <!-- Scene 4: CTA -->
    <div id="scene4" class="scene" data-start="15" data-duration="4">
      <h1 id="s4-text">Create Something Amazing</h1>
      <div id="s4-cta">Get Started</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
    <script>
      // Create paused timeline
      const tl = gsap.timeline({ paused: true });
      
      // === SCENE 1: Title Reveal (0-5s) ===
      tl.to("#scene1", { autoAlpha: 1, duration: 0.01 }, 0);
      tl.from("#s1-title", { 
        y: 80, 
        opacity: 0, 
        duration: 1, 
        ease: "power3.out" 
      }, 0.3);
      tl.from("#s1-subtitle", { 
        y: 40, 
        opacity: 0, 
        duration: 0.8, 
        ease: "power2.out" 
      }, 0.8);
      
      // Scene 1 exit
      tl.to("#scene1", { autoAlpha: 0, duration: 0.5 }, 4.5);
      
      // === SCENE 2: Stats Counter (5-10s) ===
      tl.to("#scene2", { autoAlpha: 1, duration: 0.01 }, 5);
      tl.from("#stat1", { scale: 0.5, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, 5.3);
      tl.from("#stat2", { scale: 0.5, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, 5.6);
      tl.from("#stat3", { scale: 0.5, opacity: 0, duration: 0.6, ease: "back.out(1.7)" }, 5.9);
      
      // Counter animations
      tl.to("#stat1 .stat-number", {
        innerText: 100,
        duration: 2,
        snap: { innerText: 1 },
        ease: "power1.out"
      }, 6.5);
      tl.to("#stat2 .stat-number", {
        innerText: 50,
        duration: 2,
        snap: { innerText: 1 },
        ease: "power1.out"
      }, 6.5);
      tl.to("#stat3 .stat-number", {
        innerText: 25,
        duration: 2,
        snap: { innerText: 1 },
        ease: "power1.out"
      }, 6.5);
      
      // Scene 2 exit
      tl.to("#scene2", { autoAlpha: 0, duration: 0.5 }, 9.5);
      
      // === SCENE 3: Features Slide In (10-15s) ===
      tl.to("#scene3", { autoAlpha: 1, duration: 0.01 }, 10);
      tl.from("#feat1", { x: -150, opacity: 0, duration: 0.8, ease: "power3.out" }, 10.3);
      tl.from("#feat2", { x: -150, opacity: 0, duration: 0.8, ease: "power3.out" }, 10.7);
      tl.from("#feat3", { x: -150, opacity: 0, duration: 0.8, ease: "power3.out" }, 11.1);
      
      // Breathe animation on features
      tl.to("#feat1", { x: 10, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 11.5);
      tl.to("#feat2", { x: 10, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 12);
      tl.to("#feat3", { x: 10, duration: 1.5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 12.5);
      
      // Scene 3 exit
      tl.to("#scene3", { autoAlpha: 0, duration: 0.5 }, 14.5);
      
      // === SCENE 4: CTA (15-19s) ===
      tl.to("#scene4", { autoAlpha: 1, duration: 0.01 }, 15);
      tl.from("#s4-text", { 
        scale: 0.5, 
        opacity: 0, 
        duration: 0.8, 
        ease: "back.out(1.7)" 
      }, 15.3);
      tl.from("#s4-cta", { 
        y: 50, 
        opacity: 0, 
        duration: 0.6, 
        ease: "power2.out" 
      }, 15.8);
      
      // Pulse on CTA
      tl.to("#s4-cta", { 
        scale: 1.05, 
        duration: 0.3, 
        ease: "power1.inOut", 
        yoyo: true, 
        repeat: 2 
      }, 16.5);
      
      // Register timeline
      window.__timelines = window.__timelines || {};
      window.__timelines["motion-demo"] = tl;
    </script>
  </div>
</body>
</html>
