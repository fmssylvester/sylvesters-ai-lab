    <div class="overlay" id="overlay"></div>
    <div class="curtain" id="curtain"></div>
    <div class="scanline" id="scanline"></div>
    <div class="flash" id="flash"></div>
    <div class="pixel-grid" id="pixel-grid"></div>
    <div class="vignette" id="vignette"></div>
    <div class="title-slam"><h1 id="title">You're prompting AI video <span class="red">wrong.</span></h1></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns on bg
    tl.fromTo('#bg', { scale: 1.0, x: 0 }, { scale: 1.08, x: -20, duration: 6, ease: 'none' }, 0);

    // Phase A: Scanline reveal (0-1.5s)
    tl.set('#scanline', { opacity: 1, top: -10 });
    tl.to('#scanline', { top: 1090, duration: 1.2, ease: 'power1.inOut' }, 0);
    tl.to('#scanline', { opacity: 0, duration: 0.1 }, 1.15);
    // Curtain clips away as scanline passes
    tl.fromTo('#curtain', { clipPath: 'inset(0 0 0 0)' }, { clipPath: 'inset(0 0 100% 0)', duration: 1.2, ease: 'power1.inOut' }, 0);
    // Flash on reveal
    tl.to('#flash', { opacity: 0.15, duration: 0.05 }, 0.3);
    tl.to('#flash', { opacity: 0, duration: 0.15 }, 0.35);

    // Phase B: Fail montage (1.5-3.7s) — cross-dissolve 3 images
    tl.set('#fail1', { opacity: 1 }, 1.3);
    tl.to('#fail1', { opacity: 0, duration: 0.2 }, 1.8);
    tl.set('#fail2', { opacity: 1 }, 1.8);
    tl.to('#fail2', { opacity: 0, duration: 0.2 }, 2.4);
    tl.set('#fail3', { opacity: 1 }, 2.4);
    // Red flash on each transition
    tl.to('#flash', { opacity: 0.2, duration: 0.05 }, 1.8);
    tl.to('#flash', { opacity: 0, duration: 0.1 }, 1.85);
    tl.to('#flash', { opacity: 0.2, duration: 0.05 }, 2.4);
    tl.to('#flash', { opacity: 0, duration: 0.1 }, 2.45);

    // Phase C: Pixel shatter (3.7-6s)
    // Build pixel grid
    const grid = document.getElementById('pixel-grid');
    const COLS = 16, ROWS = 9;
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const d = document.createElement('div');
        d.className = 'pixel';
        d.style.width = (100/COLS) + '%';
        d.style.height = (100/ROWS) + '%';
        d.style.left = (c * 100/COLS) + '%';
        d.style.top = (r * 100/ROWS) + '%';
        d.style.backgroundImage = 'url(runner_chaotic.png)';
        d.style.backgroundSize = (COLS*100) + '% ' + (ROWS*100) + '%';
        d.style.backgroundPosition = (c*100/(COLS-1)) + '% ' + (r*100/(ROWS-1)) + '%';
        grid.appendChild(d);
      }
    }

    tl.set('#pixel-grid', { display: 'block', opacity: 1 }, 3.5);
    tl.set('#fail3', { opacity: 0 }, 3.5);
    tl.set('#overlay', { opacity: 0 }, 3.5);

    // Shatter pixels
    const pixels = document.querySelectorAll('.pixel');
    pixels.forEach((p) => {
      const angle = Math.random() * Math.PI * 2;
      const dist = 300 + Math.random() * 900;
      const rot = (Math.random() - 0.5) * 720;
      tl.to(p, {
        x: Math.cos(angle) * dist,
        y: Math.sin(angle) * dist,
        rotation: rot,
        opacity: 0,
        duration: 0.4 + Math.random() * 0.3,
        ease: 'power2.out'
      }, 3.5 + Math.random() * 0.15);
    });

    // Title slam
    tl.to('#title', { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2.5)' }, 4.2);
    // Screen shake
    tl.to('#root', { x: 3, duration: 0.03 }, 4.45);
    tl.to('#root', { x: -2, duration: 0.03 }, 4.48);
    tl.to('#root', { x: 1, duration: 0.03 }, 4.51);
    tl.to('#root', { x: 0, duration: 0.05 }, 4.54);
    // Vignette intensify
    tl.to('#vignette', { opacity: 0.8, duration: 0.5 }, 4.2);
    // Cut
    tl.to('#title', { opacity: 0, duration: 0.05 }, 5.5);
    tl.set('#pixel-grid', { display: 'none' }, 5.5);

    window.__timelines['cold-open'] = tl;
  </script>
