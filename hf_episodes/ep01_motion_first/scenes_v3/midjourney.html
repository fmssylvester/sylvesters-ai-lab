<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    .bg { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.7) 100%); }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%); }
    .glass-panel { position: absolute; top: 50%; left: 50%; width: 800px; height: 420px; transform: translate(-50%, -50%) translateY(200px); background: rgba(8,8,8,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; opacity: 0; overflow: hidden; }
    .panel-header { padding: 20px 24px 0; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.4); letter-spacing: 0.15em; text-transform: uppercase; }
    .panel-prompt { padding: 16px 24px; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #00d4ff; line-height: 1.6; min-height: 80px; }
    .panel-cards { display: flex; gap: 10px; padding: 0 24px; }
    .panel-card { flex: 1; height: 120px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
    .panel-label { padding: 8px 24px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: rgba(255,255,255,0.3); }
    .panel2 { position: absolute; top: 50%; left: 50%; width: 800px; height: 350px; transform: translate(-50%, -50%) translateY(200px); background: rgba(8,8,8,0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; opacity: 0; overflow: hidden; }
    .panel2-header { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; }
    .panel2-title { font-size: 14px; font-weight: 600; color: #fff; }
    .gen-btn { padding: 8px 20px; background: #00d4ff; color: #080808; font-weight: 700; font-size: 13px; border-radius: 8px; border: none; }
    .panel2-input { margin: 16px 24px; padding: 12px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #fff; min-height: 44px; }
    .fail-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; flex-direction: column; opacity: 0; }
    .fail-x { font-size: 80px; color: #c0392b; font-weight: 900; }
    .fail-text { font-size: 22px; font-weight: 600; color: #c0392b; margin-top: 12px; }
    .cursor { display: inline-block; width: 2px; height: 18px; background: #00d4ff; margin-left: 2px; animation: blink 0.6s infinite; vertical-align: text-bottom; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
  </style>
</head>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns
    tl.fromTo('#bg', { scale: 1.0, y: 0 }, { scale: 1.06, y: -15, duration: 5, ease: 'none' }, 0);

    // Panel 1 enters
    tl.to('#panel1', { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.3)' }, 0.3);

    // Typewriter prompt 1
    const p1 = 'cinematic portrait of a woman in red jacket, neon-lit streets, shallow depth of field, Kodak Portra 400';
    const el1 = document.getElementById('prompt1');
    tl.to(el1, {
      duration: 1.5,
      onStart: () => {
        let i = 0;
        const iv = setInterval(() => {
          if (i < p1.length) { el1.innerHTML = p1.substring(0, i + 1) + '<span class="cursor"></span>'; i++; }
          else { clearInterval(iv); }
        }, 30);
      }
    }, 0.8);

    // Panel 1 exits
    tl.to('#panel1', { y: -300, opacity: 0, duration: 0.4, ease: 'power2.in' }, 3.0);

    // Panel 2 enters
    tl.to('#panel2', { opacity: 1, y: 0, duration: 0.5, ease: 'back.out(1.3)' }, 3.3);

    // Typewriter prompt 2 (same text pasted)
    const el2 = document.getElementById('prompt2');
    tl.to(el2, {
      duration: 0.8,
      onStart: () => {
        let i = 0;
        const iv = setInterval(() => {
          if (i < p1.length) { el2.innerHTML = p1.substring(0, i + 1) + '<span class="cursor"></span>'; i++; }
          else { clearInterval(iv); }
        }, 15);
      }
    }, 3.5);

    // Generate button pulse
    tl.to('#gen-btn', { scale: 1.05, duration: 0.15, yoyo: true, repeat: 1 }, 4.0);

    // Fail X stamps
    tl.to('#fail-overlay', { opacity: 1, duration: 0.01 }, 4.3);
    tl.fromTo('#fail-x', { scale: 0 }, { scale: 1.2, duration: 0.2, ease: 'back.out(3)' }, 4.3);
    tl.to('#fail-x', { scale: 1, duration: 0.1 }, 4.5);

    window.__timelines['midjourney'] = tl;
