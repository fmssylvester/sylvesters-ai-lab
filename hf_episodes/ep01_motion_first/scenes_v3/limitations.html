  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    .bg { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.35) 40%, rgba(0,0,0,0.7) 100%); }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%); }
    .warn-icon { position: absolute; top: 140px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 24px solid transparent; border-right: 24px solid transparent; border-bottom: 42px solid #e8a020; opacity: 0; }

    .warn-title { position: absolute; top: 200px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: #e8a020; letter-spacing: 0.15em; opacity: 0; }
    .cards { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%); display: flex; gap: 24px; }
    .limit-card { width: 340px; height: 200px; background: rgba(8,8,8,0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); padding: 28px; opacity: 0; }
    .limit-icon { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; margin-bottom: 14px; }
    .limit-card:nth-child(1) .limit-icon { border: 2px solid #c0392b; color: #c0392b; }
    .limit-card:nth-child(2) .limit-icon { border: 2px solid #e8a020; color: #e8a020; }
    .limit-card:nth-child(3) .limit-icon { border: 2px solid #00d4ff; color: #00d4ff; }
    .limit-title { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    .limit-desc { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.5; }
    .bottom-text { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 500; color: #fff; opacity: 0; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }

    <div class="vignette"></div>
    <div class="warn-icon" id="warn"></div>
    <div class="warn-title" id="warn-title">REAL LIMITATIONS</div>
    <div class="cards">
      <div class="limit-card" id="lc1">
        <div class="limit-icon">⏱</div>
        <div class="limit-title">DURATION</div>
        <div class="limit-desc">4-10 seconds max. No long takes. Every frame counts.</div>
      </div>
      <div class="limit-card" id="lc2">
        <div class="limit-icon">⛓</div>
        <div class="limit-title">COHERENCE</div>
        <div class="limit-desc">Characters shift. Objects morph. Consistency is hard.</div>
      </div>
      <div class="limit-card" id="lc3">
        <div class="limit-icon">◎</div>
        <div class="limit-title">CONTROL</div>

      </div>
    </div>
    <div class="bottom-text" id="bottom">But knowing the limits is power.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#bg', { scale: 1.0, y: 0 }, { scale: 1.05, y: -10, duration: 4, ease: 'none' }, 0);

    // Warning icon spins in
    tl.to('#warn', { opacity: 1, scale: 1, rotation: 0, duration: 0.3, ease: 'back.out(3)' }, 0.2);
    tl.to('#warn-title', { opacity: 1, duration: 0.2 }, 0.5);

    // Cards enter from different directions
    tl.fromTo('#lc1', { x: -100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.5)' }, 0.8);
    tl.fromTo('#lc2', { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.5)' }, 1.0);
    tl.fromTo('#lc3', { x: 100, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: 'back.out(1.5)' }, 1.2);

    // Red border pulses
    tl.to('#lc1', { borderColor: 'rgba(192,57,43,0.4)', duration: 0.2, yoyo: true, repeat: 1 }, 2.0);
    tl.to('#lc2', { borderColor: 'rgba(192,57,43,0.4)', duration: 0.2, yoyo: true, repeat: 1 }, 2.2);
    tl.to('#lc3', { borderColor: 'rgba(192,57,43,0.4)', duration: 0.2, yoyo: true, repeat: 1 }, 2.4);

    // Bottom text
    tl.to('#bottom', { opacity: 1, duration: 0.3 }, 2.8);

    window.__timelines['limitations'] = tl;
  </script>
