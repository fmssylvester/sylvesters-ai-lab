    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    .bg { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%); }
    .chart-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 1200px; height: 520px; background: rgba(8,8,8,0.6); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); }
    .chart-title { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 0.08em; opacity: 0; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }
    .axis-y { position: absolute; left: 220px; top: 180px; width: 1px; height: 320px; background: rgba(255,255,255,0.2); transform-origin: top; transform: scaleY(0); }
    .axis-x { position: absolute; left: 220px; bottom: 140px; width: 900px; height: 1px; background: rgba(255,255,255,0.2); transform-origin: left; transform: scaleX(0); }
    .bar-group { position: absolute; bottom: 141px; display: flex; flex-direction: column; align-items: center; }
    .bar { width: 120px; border-radius: 8px 8px 0 0; transform-origin: bottom; transform: scaleY(0); }
    .bar-value { font-size: 20px; font-weight: 700; margin-bottom: 8px; opacity: 0; }
    .bar-label { position: absolute; bottom: -30px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.5); white-space: nowrap; opacity: 0; }
    .particles { position: absolute; pointer-events: none; }
    .particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: 0; }
  </style>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#bg', { scale: 1.0, x: 0 }, { scale: 1.04, x: -10, duration: 4.5, ease: 'none' }, 0);

    tl.to('#title', { opacity: 1, duration: 0.3 }, 0.2);

    // Axes draw
    tl.to('#axis-y', { scaleY: 1, duration: 0.4, ease: 'power2.out' }, 0.5);
    tl.to('#axis-x', { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 0.5);

    // Bars spring up
    tl.to('#b1', { scaleY: 1, duration: 0.5, ease: 'back.out(1.5)' }, 1.0);
    tl.to('#bv1', { opacity: 1, duration: 0.2 }, 1.3);
    tl.to('#bg1 .bar-label', { opacity: 1, duration: 0.2 }, 1.3);

    tl.to('#b2', { scaleY: 1, duration: 0.5, ease: 'back.out(1.8)' }, 1.4);
    tl.to('#bv2', { opacity: 1, duration: 0.2 }, 1.7);
    tl.to('#bg2 .bar-label', { opacity: 1, duration: 0.2 }, 1.7);

    tl.to('#b3', { scaleY: 1, duration: 0.5, ease: 'back.out(2)' }, 1.8);
    tl.to('#bv3', { opacity: 1, duration: 0.2 }, 2.1);
    tl.to('#bg3 .bar-label', { opacity: 1, duration: 0.2 }, 2.1);

    tl.to('#b4', { scaleY: 1, duration: 0.6, ease: 'back.out(2.5)' }, 2.2);
    tl.to('#bv4', { opacity: 1, duration: 0.2 }, 2.6);
    tl.to('#bg4 .bar-label', { opacity: 1, duration: 0.2 }, 2.6);

    // Particle burst on highest bar
    const particleContainer = document.getElementById('particles');
    for (let i = 0; i < 10; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = '830px';
      p.style.bottom = '306px';
      particleContainer.appendChild(p);
      const angle = (Math.PI * 2 / 10) * i;
      const dist = 30 + Math.random() * 50;
      tl.to(p, { opacity: 1, x: Math.cos(angle) * dist, y: -Math.sin(angle) * dist, duration: 0.4, ease: 'power2.out' }, 2.6);
      tl.to(p, { opacity: 0, y: '+=' + (20 + Math.random() * 30), duration: 0.3 }, 3.0);
    }

    window.__timelines['bar-chart'] = tl;
  </script>
