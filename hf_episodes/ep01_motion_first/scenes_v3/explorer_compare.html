  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    .bg-left { position: absolute; top: -5%; left: -5%; width: 55%; height: 110%; background-size: cover; background-position: center; filter: grayscale(0.6) contrast(0.8); }
    .bg-right { position: absolute; top: -5%; right: -5%; width: 55%; height: 110%; background-size: cover; background-position: center; filter: saturate(1.1) contrast(1.05); }
    .tint-left { position: absolute; top: 0; left: 0; width: 50%; height: 100%; background: rgba(192,57,43,0.12); }
    .tint-right { position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: rgba(0,212,255,0.06); }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
    .divider { position: absolute; top: 0; left: 50%; width: 2px; height: 0; background: rgba(255,255,255,0.2); z-index: 5; transform: translateX(-50%); }
    .badge { position: absolute; top: 50px; padding: 8px 24px; border-radius: 20px; font-size: 14px; font-weight: 700; letter-spacing: 0.1em; opacity: 0; transform: scale(0); z-index: 10; }
    .badge-bad { left: 80px; background: #c0392b; color: #fff; }
    .badge-good { right: 80px; background: #00e5a0; color: #080808; }
    .prompt-box { position: absolute; top: 120px; width: 760px; padding: 20px 24px; background: rgba(8,8,8,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-radius: 12px; border: 1px solid rgba(255,255,255,0.08); opacity: 0; z-index: 10; }
    .prompt-box-left { left: 80px; }
    .prompt-box-right { right: 80px; }
    .prompt-text { font-family: 'JetBrains Mono', monospace; font-size: 15px; line-height: 1.6; }
    .prompt-box-left .prompt-text { color: rgba(255,255,255,0.5); }
    .prompt-box-right .prompt-text { color: #fff; }
    .glitch { position: absolute; top: 0; left: 0; width: 50%; height: 100%; z-index: 3; opacity: 0; pointer-events: none; }
    .glitch-bar { position: absolute; left: 0; width: 100%; background: rgba(192,57,43,0.3); }
    .assessment { position: absolute; bottom: 120px; width: 760px; font-size: 18px; font-weight: 500; opacity: 0; z-index: 10; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }
    .assessment-left { left: 80px; color: #c0392b; }
    .assessment-right { right: 80px; color: #00e5a0; }
    .bloom { position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: radial-gradient(ellipse at 60% 40%, rgba(0,212,255,0.06) 0%, transparent 60%); z-index: 2; opacity: 0; }
  </style>

    <div class="tint-left"></div>
    <div class="tint-right"></div>
    <div class="overlay"></div>
    <div class="divider" id="divider"></div>
    <div class="glitch" id="glitch"></div>
    <div class="bloom" id="bloom"></div>

    <div class="badge badge-bad" id="badge-bad">BAD</div>
    <div class="badge badge-good" id="badge-good">GOOD</div>

    <div class="prompt-box prompt-box-left" id="pb-left">
      <div class="prompt-text">"a cool scene with a guy doing something interesting in a dark place with cool lighting"</div>
    </div>
    <div class="prompt-box prompt-box-right" id="pb-right">
      <div class="prompt-text">"an old explorer holding a lantern discovers ancient ruins, chiaroscuro lighting, dust particles floating in beam of light"</div>
    </div>

    <div class="assessment assessment-left" id="assess-left">Generic. No direction. AI guesses.</div>
    <div class="assessment assessment-right" id="assess-right">Specific. Every word guides the camera.</div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns — opposite directions
    tl.fromTo('#bg-left', { scale: 1.0, x: 0 }, { scale: 1.04, x: 10, duration: 6.5, ease: 'none' }, 0);
    tl.fromTo('#bg-right', { scale: 1.0, x: 0 }, { scale: 1.04, x: -10, duration: 6.5, ease: 'none' }, 0);

    // Divider
    tl.to('#divider', { height: '100%', duration: 0.4, ease: 'power2.inOut' }, 0.2);

    // Badges
    tl.to('#badge-bad', { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)' }, 0.5);
    tl.to('#badge-good', { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(3)' }, 0.7);

    // Prompt boxes
    tl.fromTo('#pb-left', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 1.0);
    tl.fromTo('#pb-right', { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 1.3);

    // Glitch on left side
    const glitchEl = document.getElementById('glitch');
    for (let i = 0; i < 12; i++) {
      const bar = document.createElement('div');
      bar.className = 'glitch-bar';
      bar.style.top = (Math.random() * 100) + '%';
      bar.style.height = (2 + Math.random() * 6) + 'px';
      glitchEl.appendChild(bar);
    }
    tl.to('#glitch', { opacity: 1, duration: 0.01 }, 2.5);
    // Flicker glitch bars
    for (let i = 0; i < 8; i++) {
      tl.to('#glitch', { opacity: Math.random() > 0.3 ? 0.8 : 0, duration: 0.05 }, 2.5 + i * 0.15);
    }
    tl.to('#glitch', { opacity: 0.4, duration: 0.3 }, 3.7);

    // Bloom on right side
    tl.to('#bloom', { opacity: 1, duration: 0.5 }, 2.5);

    // Assessments
    tl.to('#assess-left', { opacity: 1, y: 0, duration: 0.3 }, 3.5);
    tl.to('#assess-right', { opacity: 1, y: 0, duration: 0.3 }, 3.8);

    // Hold
    // Exit
    tl.to('#pb-left, #pb-right, #badge-bad, #badge-good, #assess-left, #assess-right', { opacity: 0, duration: 0.3 }, 6.0);

    window.__timelines['explorer-compare'] = tl;
  </script>
