  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns
    tl.fromTo('#bg', { scale: 1.0, x: 0 }, { scale: 1.04, x: -8, duration: 4, ease: 'none' }, 0);

    // Background fade in
    tl.fromTo('#bg', { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0);

    // Opening quote
    tl.to('#qo', { opacity: 1, y: 0, duration: 0.4 }, 0.3);

    // Words appear one by one
    tl.to('#w1', { opacity: 1, y: 0, duration: 0.2 }, 0.8);
    tl.to('#w2', { opacity: 1, y: 0, duration: 0.2 }, 1.0);
    tl.to('#w3', { opacity: 1, y: 0, duration: 0.2 }, 1.2);
    tl.to('#w4', { opacity: 1, y: 0, duration: 0.3, ease: 'back.out(1.5)' }, 1.4);

    // Screen pulse on "direction"
    tl.to('#root', { scale: 1.005, duration: 0.05, yoyo: true, repeat: 1 }, 1.6);

    // Underline draws
    tl.to('#underline', { width: 300, duration: 0.3, ease: 'power2.out' }, 1.7);

    // Closing quote
    tl.to('#qc', { opacity: 1, y: 0, duration: 0.3 }, 2.0);

    // Subtitle
    tl.to('#sub', { opacity: 1, duration: 0.3 }, 2.3);

    // Bloom
    tl.to('#bloom', { opacity: 1, duration: 0.5 }, 2.0);

    window.__timelines['verdict'] = tl;
