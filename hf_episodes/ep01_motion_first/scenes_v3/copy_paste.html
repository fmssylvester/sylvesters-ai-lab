  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; }
    .bg { position: absolute; top: -5%; left: -5%; width: 110%; height: 110%; background-size: cover; background-position: center; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.65); }
    .vignette { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%); }
    .divider { position: absolute; top: 0; left: 50%; width: 2px; height: 0; background: rgba(255,255,255,0.15); z-index: 5; transform: translateX(-50%); }
    .panel { position: absolute; top: 50%; width: 780px; height: 480px; transform: translateY(-50%); background: rgba(8,8,8,0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 16px; border: 1px solid rgba(255,255,255,0.08); opacity: 0; overflow: hidden; }
    .panel-left { left: 80px; }
    .panel-right { right: 80px; }
    .panel-header { padding: 24px 28px 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
    .panel-left .panel-header { color: #00d4ff; }
    .panel-right .panel-header { color: #e8a020; }
    .panel-sub { padding: 8px 28px 0; font-size: 14px; color: rgba(255,255,255,0.5); }
    .panel-thumb { margin: 20px 28px; width: 300px; height: 200px; border-radius: 8px; background-size: cover; background-position: center; }
    .panel-right .panel-thumb { animation: drift 3s ease-in-out infinite; }
    @keyframes drift { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    .crack { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10; opacity: 0; }
    .crack-line { width: 200px; height: 2px; background: #c0392b; position: relative; }
    .crack-x { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #c0392b; font-weight: 900; }
    .bottom-text { position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 500; color: #c0392b; opacity: 0; text-align: center; text-shadow: 0 2px 20px rgba(0,0,0,0.8); }

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#bg', { scale: 1.02, x: 10 }, { scale: 1.08, x: -10, duration: 4, ease: 'none' }, 0);

    // Divider draws
    tl.to('#divider', { height: '100%', duration: 0.4, ease: 'power2.inOut' }, 0.2);

    // Left panel slides in
    tl.fromTo('#left', { x: -400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.3)' }, 0.5);

    // Right panel slides in
    tl.fromTo('#right', { x: 400, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: 'back.out(1.3)' }, 0.9);

    // Crack appears
    tl.to('#crack', { opacity: 1, duration: 0.01 }, 1.8);
    tl.fromTo('#crack', { scale: 0 }, { scale: 1, duration: 0.25, ease: 'back.out(3)' }, 1.8);
    // Panels shake on crack
    tl.to('#left', { x: -8, duration: 0.05 }, 1.8);
    tl.to('#left', { x: 0, duration: 0.1 }, 1.85);
    tl.to('#right', { x: 8, duration: 0.05 }, 1.8);
    tl.to('#right', { x: 0, duration: 0.1 }, 1.85);

    // Bottom text
    tl.to('#bottom', { opacity: 1, duration: 0.3 }, 2.2);

    // Red border pulse on panels
    tl.to('#left', { borderColor: 'rgba(192,57,43,0.4)', duration: 0.3, yoyo: true, repeat: 2 }, 2.5);
    tl.to('#right', { borderColor: 'rgba(192,57,43,0.4)', duration: 0.3, yoyo: true, repeat: 2 }, 2.5);

    window.__timelines['copy-paste'] = tl;
  </script>
