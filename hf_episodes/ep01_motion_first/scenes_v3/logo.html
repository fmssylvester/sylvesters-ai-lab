    <div class="overlay"></div>
    <div class="vignette"></div>
    <div class="logo-circle" id="circle"></div>
    <div class="logo-center">
      <div class="logo-text" id="logo-text">SYLVESTER'S AI LAB</div>
      <div class="logo-line" id="logo-line"></div>
      <div class="logo-sub" id="logo-sub">AI VIDEO PROMPTING</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns
    tl.fromTo('#bg', { scale: 1.0, x: 0 }, { scale: 1.03, x: -10, duration: 2, ease: 'none' }, 0);

    // Background fade in
    tl.fromTo('#bg', { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0);

    // Logo text — each letter drops in
    const text = "SYLVESTER'S AI LAB";
    const el = document.getElementById('logo-text');
    el.innerHTML = '';
    text.split('').forEach((ch, i) => {
      const span = document.createElement('span');
      span.textContent = ch;
      span.style.cssText = 'display:inline-block; opacity:0; transform:translateY(-40px) rotateX(-90deg);';
      el.appendChild(span);
    });
    const letters = el.querySelectorAll('span');
    letters.forEach((l, i) => {
      tl.to(l, { opacity: 1, y: 0, rotationX: 0, duration: 0.35, ease: 'back.out(1.5)' }, 0.15 + i * 0.03);
    });

    // Cyan line draws
    tl.to('#logo-line', { width: 400, duration: 0.4, ease: 'power2.out' }, 0.5);

    // Circle stamp
    tl.to('#circle', { scale: 1, duration: 0.3, ease: 'back.out(1.8)' }, 0.6);
    tl.to('#circle', { scale: 1.05, duration: 0.15, ease: 'power2.in' }, 0.9);
    tl.to('#circle', { scale: 1.0, duration: 0.2, ease: 'power2.out' }, 1.05);

    // Subtitle
    tl.to('#logo-sub', { opacity: 1, y: 0, duration: 0.3 }, 1.0);

    // Gentle pulse
    tl.to('.logo-center', { scale: 1.01, duration: 0.8, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 1.2);

    window.__timelines['logo'] = tl;
  </script>
