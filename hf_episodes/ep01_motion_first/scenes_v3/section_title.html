  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Ken Burns reverse zoom (pull back to reveal)
    tl.fromTo('#bg', { scale: 1.05, x: 10 }, { scale: 1.0, x: 0, duration: 3, ease: 'none' }, 0);

    // Gold line expands from center
    tl.to('#gold-line', { width: 600, duration: 0.5, ease: 'power2.out' }, 0.1);

    // Number stamp slams in
    tl.to('#num', { opacity: 1, scale: 1, rotation: 0, duration: 0.25, ease: 'back.out(3)' }, 0.3);
    // Flash impact
    tl.to('#flash', { opacity: 0.3, duration: 0.05 }, 0.3);
    tl.to('#flash', { opacity: 0, duration: 0.15 }, 0.35);

    // Text clip-path reveal
    tl.to('#text', { opacity: 1, duration: 0.01 }, 0.6);
    tl.fromTo('#text', { clipPath: 'inset(0 100% 0 0)' }, { clipPath: 'inset(0 0% 0 0)', duration: 0.4, ease: 'power2.out' }, 0.6);

    // Divider draws
    tl.to('#divider', { width: 200, duration: 0.3, ease: 'power2.out' }, 0.9);

    // Subtitle
    tl.to('#sub', { opacity: 1, duration: 0.3 }, 1.1);

    // Hold then exit
    tl.to('#num, #text, #divider, #sub', { y: -30, opacity: 0, duration: 0.3 }, 2.6);

    window.__timelines['section-title'] = tl;
  </script>
