<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #080808; font-family: 'Inter', sans-serif; color: #fff; }
    .bar-container { position: absolute; bottom: 200px; left: 200px; right: 200px; }
    .bar-row { display: flex; align-items: center; margin-bottom: 24px; opacity: 0; }
    .bar-label { width: 160px; font-size: 16px; font-weight: 700; text-align: right; padding-right: 20px; color: #888; }
    .bar-track { flex: 1; height: 40px; background: #111; border-radius: 6px; overflow: hidden; position: relative; }
    .bar-fill { height: 100%; border-radius: 6px; width: 0; display: flex; align-items: center; padding-left: 16px; font-size: 14px; font-weight: 700; }
    .bar-fill.static { background: linear-gradient(90deg, #c0392b, #e74c3c); }
    .bar-fill.motion { background: linear-gradient(90deg, #00d4ff, #00e5a0); }
    .title { position: absolute; top: 120px; left: 200px; font-size: 48px; font-weight: 900; opacity: 0; }
    .title .hl { color: #00d4ff; }
    .subtitle { position: absolute; top: 200px; left: 200px; font-size: 20px; color: #666; opacity: 0; }
    .formula-mini { position: absolute; top: 300px; left: 200px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #00e5a0; opacity: 0; padding: 12px 20px; background: rgba(0,229,160,0.08); border-radius: 8px; border: 1px solid rgba(0,229,160,0.2); }
  </style>
</head>
<body>
  <div id="root" data-composition-id="bar-chart" data-start="0" data-duration="5" data-width="1920" data-height="1080">
    <div class="title" id="title">Prompting is a <span class="hl">numbers game</span></div>
    <div class="subtitle" id="subtitle">More specific inputs = more chances for the AI to find motion</div>
    <div class="formula-mini" id="formula">subject + action + detail + environment + motion cue = result</div>
    <div class="bar-container">
      <div class="bar-row" id="row1">
        <div class="bar-label">Generic</div>
        <div class="bar-track"><div class="bar-fill static" id="bar1">12%</div></div>
      </div>
      <div class="bar-row" id="row2">
        <div class="bar-label">Descriptive</div>
        <div class="bar-track"><div class="bar-fill static" id="bar2">34%</div></div>
      </div>
      <div class="bar-row" id="row3">
        <div class="bar-label">Specific</div>
        <div class="bar-track"><div class="bar-fill motion" id="bar3">67%</div></div>
      </div>
      <div class="bar-row" id="row4">
        <div class="bar-label">Formula-based</div>
        <div class="bar-track"><div class="bar-fill motion" id="bar4">89%</div></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    // Title appears
    tl.to('#title', { opacity: 1, duration: 0.4, ease: 'power2.out' }, 0);
    tl.to('#subtitle', { opacity: 1, duration: 0.3 }, 0.3);

    // Bars animate in sequentially
    const bars = [
      { row: '#row1', bar: '#bar1', width: '12%', delay: 0.8 },
      { row: '#row2', bar: '#bar2', width: '34%', delay: 1.3 },
      { row: '#row3', bar: '#bar3', width: '67%', delay: 1.8 },
      { row: '#row4', bar: '#bar4', width: '89%', delay: 2.3 },
    ];

    bars.forEach(b => {
      tl.to(b.row, { opacity: 1, duration: 0.2 }, b.delay);
      tl.to(b.bar, { width: b.width, duration: 0.6, ease: 'power2.out' }, b.delay + 0.1);
    });

    // Formula appears
    tl.to('#formula', { opacity: 1, duration: 0.4 }, 3.2);

    // Fade out
    tl.to('#title, #subtitle, #formula, .bar-container', { opacity: 0, duration: 0.3 }, 4.5);

    window.__timelines['bar-chart'] = tl;
  </script>
</body>
</html>
