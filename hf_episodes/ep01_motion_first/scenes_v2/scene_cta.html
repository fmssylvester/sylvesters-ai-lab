<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1920px; height: 1080px; overflow: hidden; background: #080808; font-family: 'Inter', sans-serif; color: #fff; }
    .cta-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .subscribe-btn { display: inline-block; padding: 16px 48px; background: #c0392b; color: #fff; font-size: 20px; font-weight: 800; border-radius: 12px; opacity: 0; margin-bottom: 24px; letter-spacing: 2px; text-transform: uppercase; }
    .next-ep { font-size: 24px; font-weight: 700; color: #888; opacity: 0; margin-bottom: 16px; }
    .next-title { font-size: 32px; font-weight: 900; opacity: 0; }
    .next-title .hl { color: #00d4ff; }
    .channel-name { font-size: 16px; color: #555; margin-top: 30px; opacity: 0; letter-spacing: 4px; text-transform: uppercase; }
    .logo-mini { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); opacity: 0; }
    .logo-mini svg { width: 40px; height: 40px; }
  </style>
</head>
<body>
  <div id="root" data-composition-id="cta" data-start="0" data-duration="4" data-width="1920" data-height="1080">
    <div class="cta-container">
      <div class="subscribe-btn" id="subscribe">Subscribe</div>
      <div class="next-ep" id="next-ep">Coming Next</div>
      <div class="next-title" id="next-title">Episode 2: <span class="hl">The Visual Grammar</span></div>
      <div class="channel-name" id="channel">Sylvester's AI Lab</div>
    </div>
    <div class="logo-mini" id="logo">
      <svg viewBox="0 0 120 120">
        <path d="M40 24 L30 90 Q30 100 40 100 L80 100 Q90 100 90 90 L80 24 Z" fill="none" stroke="#00d4ff" stroke-width="3" />
        <path d="M35 75 L50 75 L55 55 L60 85 L65 65 L70 75 L85 75" fill="none" stroke="#00d4ff" stroke-width="2" />
      </svg>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    tl.fromTo('#subscribe', 
      { opacity: 0, scale: 0.8 }, 
      { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(2)' }, 
      0
    );

    tl.to('#next-ep', { opacity: 1, duration: 0.3 }, 0.6);
    tl.to('#next-title', { opacity: 1, duration: 0.4 }, 0.9);
    tl.to('#channel', { opacity: 1, duration: 0.3 }, 1.3);
    tl.to('#logo', { opacity: 0.5, duration: 0.3 }, 1.5);

    // Subscribe button pulse
    tl.to('#subscribe', { 
      boxShadow: '0 0 30px rgba(192,57,43,0.5)', 
      duration: 0.3, 
      yoyo: true, 
      repeat: 2 
    }, 1.8);

    tl.to('.cta-container, #logo', { opacity: 0, duration: 0.4 }, 3.5);

    window.__timelines['cta'] = tl;
  </script>
</body>
</html>
