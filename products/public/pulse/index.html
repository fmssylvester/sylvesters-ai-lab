<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse — Patient Records</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0c12;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    /* Login */
    .logo {
      text-align: center;
      margin-bottom: 40px;
    }
    .logo h1 { font-size: 28px; font-weight: 700; }
    .logo span { color: #2ecc71; }
    .logo p { color: #64748b; font-size: 14px; margin-top: 4px; }

    .card {
      background: #11141e;
      border: 1px solid #1e2433;
      border-radius: 20px;
      padding: 32px 24px;
    }
    .card h2 { font-size: 20px; margin-bottom: 4px; }
    .card p.sub { color: #64748b; font-size: 14px; margin-bottom: 24px; }

    input {
      width: 100%;
      padding: 14px 16px;
      background: #0a0c12;
      border: 1px solid #1e2433;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus { border-color: #2ecc71; }
    input::placeholder { color: #475569; }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: #2ecc71; color: #0a0c12; }
    .btn-secondary { background: #1e2433; color: #fff; margin-top: 12px; }

    .hidden { display: none; }

    .error {
      color: #ef4444;
      font-size: 14px;
      margin-top: 12px;
      text-align: center;
    }

    /* Dashboard */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-bar input { flex: 1; }
    .search-bar .btn { width: auto; padding: 14px 20px; }

    .record-card {
      background: #0a0c12;
      border: 1px solid #1e2433;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }
    .record-card .row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .record-card .label { color: #64748b; font-size: 13px; }
    .record-card .value { color: #fff; font-size: 15px; font-weight: 500; }
    .record-card .value.green { color: #2ecc71; }
    .record-card .value.red { color: #ef4444; }
    .record-card .value.yellow { color: #eab308; }
    .record-card .divider {
      height: 1px;
      background: #1e2433;
      margin: 12px 0;
    }
    .record-card .name {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .record-card .id {
      color: #64748b;
      font-size: 13px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success { background: rgba(46,204,113,0.15); color: #2ecc71; }
    .badge-warning { background: rgba(234,179,8,0.15); color: #eab308; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .top-bar .user { color: #64748b; font-size: 14px; }
    .top-bar .logout {
      color: #ef4444;
      font-size: 14px;
      cursor: pointer;
      background: none;
      border: none;
    }

    .spinner {
      text-align: center;
      padding: 40px;
      color: #64748b;
    }
    .spinner::after {
      content: '';
      display: block;
      width: 24px;
      height: 24px;
      border: 2px solid #1e2433;
      border-top-color: #2ecc71;
      border-radius: 50%;
      margin: 12px auto 0;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- Login Screen -->
    <div id="loginScreen">
      <div class="logo">
        <h1>Pulse<span>.</span></h1>
        <p>Patient Records System</p>
      </div>
      <div class="card">
        <h2>Welcome back</h2>
        <p class="sub">Enter your access code to continue</p>
        <input type="password" id="pinInput" placeholder="Access code" maxlength="4" autocomplete="off">
        <div class="error" id="loginError"></div>
        <button class="btn btn-primary" onclick="login()" style="margin-top:16px">Access</button>
      </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboardScreen" class="hidden">
      <div class="top-bar">
        <div class="user">Dr. <span id="doctorName">—</span></div>
        <button class="logout" onclick="logout()">Log out</button>
      </div>

      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Patient name or ID..." onkeydown="if(event.key==='Enter') search()">
        <button class="btn btn-primary" onclick="search()">Search</button>
      </div>

      <div id="loadingSpinner" class="spinner hidden">Searching records...</div>
      <div id="error" class="hidden error"></div>
      <div id="result"></div>
    </div>
  </div>

  <script>
    // Simple PIN check (demo — replace with real auth)
    const ACCESS = { pin: '1234', name: 'Sylvester' };

    function login() {
      const pin = document.getElementById('pinInput').value;
      if (pin === ACCESS.pin) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('dashboardScreen').classList.remove('hidden');
        document.getElementById('doctorName').textContent = ACCESS.name;
        document.getElementById('loginError').textContent = '';
      } else {
        document.getElementById('loginError').textContent = 'Invalid access code';
      }
    }

    function logout() {
      document.getElementById('dashboardScreen').classList.add('hidden');
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('pinInput').value = '';
      document.getElementById('result').innerHTML = '';
    }

    async function search() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const resultDiv = document.getElementById('result');
      const errorDiv = document.getElementById('error');
      const spinner = document.getElementById('loadingSpinner');

      resultDiv.innerHTML = '';
      errorDiv.classList.add('hidden');
      spinner.classList.remove('hidden');

      try {
        // n8n webhook
        const response = await fetch('https://sylvestersailab.app.n8n.cloud/webhook/8d1e40d9-d97a-4bf2-85fe-460c1ab17048/patient-lookup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        if (!response.ok) throw new Error('Not found');

        const data = await response.json();
        displayPatient(data);
      } catch (e) {
        errorDiv.textContent = 'No patient found. Try a different name or ID.';
        errorDiv.classList.remove('hidden');
      } finally {
        spinner.classList.add('hidden');
      }
    }

    function displayPatient(p) {
      const div = document.getElementById('result');
      const urgency = p.urgency || 'stable';

      div.innerHTML = `
        <div class="record-card">
          <div class="name">${p.name || 'Unknown'}</div>
          <div class="id">${p.id || '—'} · ${p.gender || '—'} · ${p.age || '—'}yrs</div>

          <div class="divider"></div>

          <div class="row">
            <span class="label">⚠ Allergies</span>
            <span class="value ${p.allergies ? 'red' : 'green'}">${p.allergies || 'None'}</span>
          </div>
          <div class="row">
            <span class="label">💊 Medications</span>
            <span class="value">${p.medications || 'None'}</span>
          </div>
          <div class="row">
            <span class="label">🩸 Blood Type</span>
            <span class="value">${p.bloodType || '—'}</span>
          </div>

          <div class="divider"></div>

          <div class="row">
            <span class="label">📅 Last Visit</span>
            <span class="value">${p.lastVisit || '—'}</span>
          </div>
          <div class="row">
            <span class="label">🔜 Next Appointment</span>
            <span class="value">${p.nextAppt || 'Not scheduled'}</span>
          </div>
          <div class="row">
            <span class="label">🏥 Conditions</span>
            <span class="value">${p.conditions || 'None'}</span>
          </div>

          <div class="divider"></div>

          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="label">Status</span>
            <span class="badge ${urgency === 'critical' ? 'badge-warning' : 'badge-success'}">${urgency}</span>
          </div>
          ${p.notes ? `<div style="margin-top:12px;color:#94a3b8;font-size:14px;border-top:1px solid #1e2433;padding-top:12px">📝 ${p.notes}</div>` : ''}
        </div>
      `;
    }
  </script>
</body>
</html>
