<!DOCTYPE html>
<html>
<head>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0c12; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  .card { background: #11141e; padding: 50px; width: 1000px; height: 1000px; border: 1px solid #1e2433; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; }
  .header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 40px; }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .logo-dot { width: 14px; height: 14px; background: #06b6d4; border-radius: 50%; box-shadow: 0 0 20px rgba(6,182,212,0.4); }
  .template-name { color: #fff; font-size: 28px; font-weight: 700; }
  .badge { background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.3); padding: 8px 20px; border-radius: 20px; color: #06b6d4; font-size: 18px; font-weight: 600; }
  .title { text-align: center; margin-bottom: 40px; }
  .title h2 { color: #fff; font-size: 24px; font-weight: 700; }
  .title p { color: #64748b; font-size: 15px; margin-top: 4px; }
  .phones { display: flex; gap: 40px; justify-content: center; align-items: center; }
  .phone { width: 220px; background: linear-gradient(180deg, #11141e, #0a0c12); border: 2px solid #2a2f3e; border-radius: 36px; padding: 16px 12px; }
  .phone-notch { width: 60px; height: 5px; background: #1e2433; border-radius: 3px; margin: 0 auto 14px; }
  .chat {}
  .msg { margin-bottom: 10px; max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.4; }
  .msg.in { background: #1e2433; color: #f1f5f9; border-bottom-left-radius: 4px; }
  .msg.out { background: #065f46; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }
  .msg.system { background: #1a1a2e; color: #94a3b8; font-size: 11px; text-align: center; border: 1px solid #2a2a3e; width: 100%; }
  .card-title { color: #fff; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
  .card-sub { color: #64748b; font-size: 10px; margin-bottom: 8px; }
  .divider { height: 1px; background: #1e293b; margin: 6px 0; }
  .c-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
  .c-label { color: #64748b; }
  .c-val { color: #f1f5f9; font-weight: 500; }
  .c-val.red { color: #ef4444; }
  .channels { display: flex; gap: 16px; margin-top: 30px; }
  .channel { text-align: center; padding: 12px 24px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; color: #94a3b8; font-size: 14px; }
  .channel .emoji { font-size: 24px; display: block; margin-bottom: 4px; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-left">
      <div class="logo-dot"></div>
      <span class="template-name">n8n Workflow</span>
    </div>
    <span class="badge">Multi-Device</span>
  </div>
  <div class="title">
    <h2>Works on Any Device</h2>
    <p>Telegram · WhatsApp · SMS · Web Dashboard</p>
  </div>
  <div class="phones">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="chat">
        <div class="msg in">Show me John Doe</div>
        <div class="msg out" style="padding:12px">
          <div class="card-title">John Doe</div>
          <div class="card-sub">PT-1024 · M · 45</div>
          <div class="divider"></div>
          <div class="c-row"><span class="c-label">⚠ Allergies</span><span class="c-val red">Penicillin</span></div>
          <div class="c-row"><span class="c-label">💊 Meds</span><span class="c-val">Metformin</span></div>
          <div class="c-row"><span class="c-label">🩸 Blood</span><span class="c-val">O+</span></div>
          <div class="divider"></div>
          <div class="c-row"><span class="c-label">📅 Last Visit</span><span class="c-val">Jun 12</span></div>
          <div class="c-row"><span class="c-label">🔜 Next</span><span class="c-val" style="color:#2ecc71">Aug 3</span></div>
        </div>
      </div>
    </div>
    <div style="color:#4a5568;font-size:40px">↔</div>
    <div class="phone">
      <div class="phone-notch"></div>
      <div style="text-align:center;padding:40px 0;color:#64748b;font-size:13px">
        <div style="font-size:40px;margin-bottom:16px">🌐</div>
        Web Dashboard<br>
        <span style="font-size:11px;color:#475569">Type. Click. View.</span>
      </div>
    </div>
  </div>
  <div class="channels">
    <div class="channel"><span class="emoji">✈️</span>Telegram</div>
    <div class="channel"><span class="emoji">💬</span>WhatsApp</div>
    <div class="channel"><span class="emoji">📱</span>SMS</div>
    <div class="channel"><span class="emoji">🖥️</span>Web</div>
  </div>
</div>
</body>
</html>
